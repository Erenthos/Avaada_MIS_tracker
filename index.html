<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Process Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
            padding: 5px; /* 5px padding from all corners */
        }

        .container {
            width: 100%;
            margin: 0; /* Remove margin */
            background: #fff;
            padding: 20px; /* Padding around the table */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        th {
        position: sticky; /* Make header sticky */
        top: 0; /* Position it at the top */
        background-color: #fff; /* Background color for the sticky header */
        z-index: 10; /* Ensure it appears above other content */
    }

        /* Adjusting the table styles */
        table.dataTable tbody tr:hover {
            background-color: #f1f1f1;
        }

        table.dataTable tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        table.dataTable tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        td:nth-child(10),
        th:nth-child(10) {
            width: 900px; /* Set fixed width for Current Status column */
            overflow-wrap: break-word; /* Break long words */
            white-space: normal; /* Allow text to wrap normally */
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>Avaada Green Projects Status Tracker</h1>
        
        <!-- Project Selection Dropdown -->
        <div class="form-group">
            <label for="projectSelect">Select Project:</label>
            <select id="projectSelect" class="form-control">
                <option value="Sheet1">Green Ammonia Project</option>
                <option value="Sheet2">Green Methanol Derivatives Project</option>
           
            </select>
        </div>
        
        <button id="fetchDataButton" class="btn btn-primary" onclick="fetchData()">Load Data</button>
        
        <table id="procurementTable" class="display table table-striped table-bordered">
            <thead>
                <tr>
                    <th>SN</th>
                    <th>Package Name</th>
                    <th>Scope Release Date</th>
                    <th>RFP Floated Date</th>
                    <th>Target LOI Date</th>
                    <th>Recommended/RFP Floated Vendors</th>
                    <th>Response Received from Vendor</th>
                    <th>Technical Cleared Vendors</th>
                    <th>Commercial Proposal Status</th>
                    <th>Current Status</th>
                    <th>Pending with Stakeholder</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="procurementData">
                <!-- Dynamic data will be inserted here -->
            </tbody>
        </table>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>

    
<script>
    // Replace with your spreadsheet ID and API Key
    const SPREADSHEET_ID = '1L8-C9GtZ8Pc-HO6AZkj2V8LuecZaxBEuRNFgDM3K1GY';
    const API_KEY = 'AIzaSyAWS6TjiAXcMcv8ZbNAEtigrFgb_KPCN-o';
    
    let dataTable;

    function fetchData() {
        const sheetName = document.getElementById('projectSelect').value;
        const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${sheetName}?key=${API_KEY}`;

        // Destroy existing DataTable if present
        if ($.fn.DataTable.isDataTable('#procurementTable')) {
            $('#procurementTable').DataTable().clear().destroy();
        }

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const tableHeader = document.getElementById('procurementHeader');
                const tableBody = document.getElementById('procurementData');
                const rows = data.values;

                if (rows) {
                    // Display the first row (header)
                    let headerRow = '<tr>';
                    rows[0].forEach(header => {
                        headerRow += `<th>${header}</th>`;
                    });
                    headerRow += '</tr>';
                    tableHeader.innerHTML = headerRow;

                    let tableRows = '';

                    // Display the rest of the rows (data)
                    rows.slice(1).forEach(row => {
                        const recommendedVendors = formatCell(row[5]);
                        const responseReceived = formatCell(row[6]);
                        const technicalCleared = formatCell(row[7]);
                        const commercialProposalStatus = formatCell(row[8]);

                        tableRows += `
                            <tr>
                                <td>${row[0] || ''}</td>
                                <td>${row[1] || ''}</td>
                                <td>${row[2] || ''}</td>
                                <td>${row[3] || ''}</td>
                                <td>${row[4] || ''}</td>
                                <td>${recommendedVendors}</td>
                                <td>${responseReceived}</td>
                                <td>${technicalCleared}</td>
                                <td>${commercialProposalStatus}</td>
                                <td>${row[9] || ''}</td>
                                <td>${row[10] || ''}</td>
                                <td>${row[11] || ''}</td>
                            </tr>`;
                    });
                    tableBody.innerHTML = tableRows;

                    // Reinitialize DataTable
                    dataTable = $('#procurementTable').DataTable({
                        responsive: true,
                        autoWidth: false
                    });
                } else {
                    tableBody.innerHTML = '<tr><td colspan="13">No data available</td></tr>';
                }
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('procurementData').innerHTML = '<tr><td colspan="13">Error loading data</td></tr>';
            });
    }

    function formatCell(cellData) {
        return cellData ? cellData.split('\n').map(vendor => `<div>${vendor.replace(/^\d+\.\s*/, '').trim()}</div>`).join('') : '';
    }
</script>
    



</body>
</html>
