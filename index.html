<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Process Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
            padding: 5px;
        }

        .container {
            width: 100%;
            margin: 0;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        th {
            position: sticky;
            top: 0;
            background-color: #fff;
            z-index: 10;
        }

        table.dataTable tbody tr:hover {
            background-color: #f1f1f1;
        }

        table.dataTable tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        table.dataTable tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        td:nth-child(10),
        th:nth-child(10) {
            width: 900px;
            overflow-wrap: break-word;
            white-space: normal;
        }
    </style>
</head>
<body>
    
    <div class="container-fluid">
        <h1 id="projectTitle">Avaada Green Projects Status Tracker</h1>
        
        <!-- Project Selection Dropdown -->
        <div class="form-group">
            <label for="projectSelect">Select Project:</label>
            <select id="projectSelect" class="form-control" onchange="updateProjectTitle()">
                <option value="Green Ammonia Project">Green Ammonia Project</option>
                <option value="Green Methanol Derivatives">Green Methanol Derivatives </option>
                <option value="PSP Chichlik">PSP - Chichlik</option>
                <option value="PSP Pawana Falyan">PSP - Pawana Falyan</option>
                <option value="IT">IT</option>
                <option value="Manufacturing Unit Butibori">Manufacturing Unit - Butibori</option>
            </select>
        </div>
        
        <!-- Background Color Picker -->
        <div class="form-group">
            <label for="bgColorPicker">Change Background Color:</label>
            <input type="color" id="bgColorPicker" class="form-control" style="width: 150 px;" onchange="changeBackgroundColor()">

       <!--     <input type="color" id="bgColorPicker" class="form-control" onchange="changeBackgroundColor()">  -->
        </div>
        
        <button id="fetchDataButton" class="btn btn-primary" onclick="fetchData()">Load Data</button>
        
        <table id="procurementTable" class="display table table-striped table-bordered">
            <thead>
                <tr>
                    <th>SN</th>
                    <th>Package Name</th>
                    <th>Scope Release Date</th>
                    <th>RFP Floated Date</th>
                    <th>Target LOI Date</th>
                    <th>Recommended/RFP Floated Vendors</th>
                    <th>Response Received from Vendor</th>
                    <th>Technical Cleared Vendors</th>
                    <th>Commercial Proposal Status</th>
                    <th>Current Status</th>
                    <th>Pending with Stakeholder</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="procurementData">
                <!-- Dynamic data will be inserted here -->
            </tbody>
        </table>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>

    
<script>
    const SPREADSHEET_ID = '1L8-C9GtZ8Pc-HO6AZkj2V8LuecZaxBEuRNFgDM3K1GY';
    const API_KEY = 'AIzaSyAWS6TjiAXcMcv8ZbNAEtigrFgb_KPCN-o';
    
    let dataTable;

    function fetchData() {
        const sheetName = document.getElementById('projectSelect').value;
        const encodedSheetName = encodeURIComponent(sheetName);
        const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodedSheetName}?key=${API_KEY}`;

        if ($.fn.DataTable.isDataTable('#procurementTable')) {
            $('#procurementTable').DataTable().clear().destroy();
        }

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('procurementData');
                const rows = data.values;

            
                
                if (rows) {
                    let tableRows = '';
                    let skipFirstRow = true;

                    rows.forEach((row, index) => {
                        if (skipFirstRow && index === 0) {
                            skipFirstRow = false;
                            return;
                        }
                       
                        
                       
const recommendedVendors = (row[5] && typeof row[5] === 'string') ? row[5].toString().split('\n').map(vendor => `<div>${vendor.replace(/^\d+\.\s*/, '').trim()}</div>`).join(''): '';

const responseReceived = (row[6] && typeof row[6] === 'string') ? row[6].toString().split('\n').map(vendor => `<div>${vendor.replace(/^\d+\.\s*/, '').trim()}</div>`).join(''): '';

const technicalCleared = (row[7] && typeof row[7] === 'string') ? row[7].toString().split('\n').map(vendor => `<div>${vendor.replace(/^\d+\.\s*/, '').trim()}</div>`).join(''): '';

const commercialProposalStatus = (row[8] && typeof row[8] === 'string') ? row[8].toString().split('\n').map(vendor => `<div>${vendor.replace(/^\d+\.\s*/, '').trim()}</div>`).join(''): '';


                        tableRows += `
                            <tr>
                                <td>${row[0] || ''}</td>
                                <td>${row[1] || ''}</td>
                                <td>${row[2] || ''}</td>
                                <td>${row[3] || ''}</td>
                                <td>${row[4] || ''}</td>
                                <td>${recommendedVendors}</td>
                                <td>${responseReceived}</td>
                                <td>${technicalCleared}</td>
                                <td>${commercialProposalStatus}</td>
                                <td>${row[9] || ''}</td>
                                <td>${row[10] || ''}</td>
                                <td>${row[11] || ''}</td>
                            </tr>`;
                    });
                    tableBody.innerHTML = tableRows;

                    dataTable = $('#procurementTable').DataTable({
                        responsive: true,
                        autoWidth: false
                    });
                } else {
                    tableBody.innerHTML = '<tr><td colspan="13">No data available</td></tr>';
                }
            })
            .catch(error => {
                console.error('Error fetching data:', error);
            });
    }


    document.addEventListener('DOMContentLoaded', () => {
    // Call this function to set the initial title on page load
    updateProjectTitle();
});
    // Function to update the project title based on the selected project
    function updateProjectTitle() {
        const projectTitle = document.getElementById('projectSelect').value;
        document.getElementById('projectTitle').innerText = projectTitle + ' Status Tracker';
    }

    // Function to change background color
    function changeBackgroundColor() {
        const bgColor = document.getElementById('bgColorPicker').value;
        document.body.style.backgroundColor = bgColor;
    }
</script>
</body>
</html>
